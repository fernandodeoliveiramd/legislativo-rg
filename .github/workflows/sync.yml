name: Sincronizar dados da Câmara

on:
  schedule:
    - cron: "0 */4 * * *" # a cada 4 horas (horário UTC)
  workflow_dispatch:
    inputs:
      years:
        description: "Anos a sincronizar, separados por vírgula (ex: 2023,2024,2025,2026). Deixe vazio para o ano corrente."
        required: false
        default: ""

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sync/package-lock.json

      - run: npm ci

      - name: Rodar sincronização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.years }}" ]; then
            node index.js --years=${{ github.event.inputs.years }}
          else
            node index.js
          fi
